# Drives BOTH simulation and analysis.
# Reference template: leave values unassigned and use the comments as a guide.

io:
  results_dir_prefix:  # Path|str: prefix under data/ for root-specific results
  analysis_subdir:  # str: analysis output subdirectory under results_root

sim:
  n_players_list:  # list[int]: table sizes to simulate
  seed:  # int: active root RNG seed
  seed_list:  # list[int]|None: roots (one for root-local, two for two-root)
  expanded_metrics:  # bool: write expanded metric aggregates
  row_dir:  # Path|str|None: relative folder for game rows; null skips writing
  metric_chunk_dir:  # Path|str|None: relative folder for metric chunks
  per_n: {}  # dict[int, SimConfig]: per-table overrides using these sim fields
  n_jobs:  # int|None: simulation workers; null=1 and 0=detected CPUs
  mp_start_method:  # str|None: multiprocessing start method
  desired_sec_per_chunk:  # int: target seconds per simulation work chunk
  ckpt_every_sec:  # int: simulation checkpoint interval in seconds
  progress_logging:
    frequent_interval_sec:  # float: initial progress-log interval in seconds
    info_phase_sec:  # float: duration of INFO-level frequent logs
    ongoing_interval_sec:  # float: continuing progress-log interval in seconds
  score_thresholds:  # list[int]|None: custom score-threshold grid
  dice_thresholds:  # list[int]|None: custom dice-threshold grid
  smart_five_opts:  # sequence[bool]|None: smart-five alternatives
  smart_one_opts:  # sequence[bool]|None: smart-one alternatives
  consider_score_opts:  # sequence[bool]: score-branching alternatives
  consider_dice_opts:  # sequence[bool]: dice-branching alternatives
  auto_hot_dice_opts:  # sequence[bool]: hot-dice alternatives
  run_up_score_opts:  # sequence[bool]: run-up-scoring alternatives
  include_stop_at:  # bool: add fixed stop-at strategy variants
  include_stop_at_heuristic:  # bool: add heuristic stop-at variants

analysis:
  disable_rng_diagnostics:  # bool: omit root-local RNG diagnostics
  n_jobs:  # int: analysis workers; 0=detected CPUs
  mp_start_method:  # str|None: multiprocessing start method
  progress_logging:
    frequent_interval_sec:  # float: initial progress-log interval in seconds
    info_phase_sec:  # float: duration of INFO-level frequent logs
    ongoing_interval_sec:  # float: continuing progress-log interval in seconds
  log_level:  # str: root-analysis logging level
  results_glob:  # str: glob selecting per-player-count result folders
  outputs: {}  # dict[str, Any]: optional curated_rows_name, metrics_name, manifest_name
  game_stats_margin_thresholds:  # sequence[int]: victory-margin report thresholds
  rare_event_target_score:  # int: multi-target rare-event score threshold
  rare_event_write_details:  # bool: write per-game rare-event detail rows
  rare_event_margin_quantile:  # float|None: optional margin rare-event quantile
  rare_event_target_rate:  # float|None: optional multi-target rare-event rate
  rng_max_matchup_groups:  # int|None: cap on eligible RNG matchup groups
  rng_diagnostic_lags:  # sequence[int]: increasing positive RNG diagnostic lags
  rng_diagnostic_partitions:  # int: stable external RNG diagnostic partitions

ingest:
  row_group_size:  # int: parquet row-group size
  parquet_codec:  # str: parquet compression codec
  batch_rows:  # int: rows processed per ingest batch
  n_jobs:  # int: concurrent ingest workers

combine:
  max_players:  # int: maximum player count in normalized concat data

trueskill:
  beta:  # float: performance variability parameter
  tau:  # float: dynamics factor between updates
  draw_probability:  # float: draw probability

head2head:
  n_jobs:  # int: H2H workers; 0=detected CPUs
  family_alpha:  # float: multiplicity-controlled family alpha
  target_power:  # float: target completed-game power
  practical_delta:  # float: primary practical win-rate effect
  sensitivity_deltas:  # sequence[float]: effects for H2H power sensitivity
  seat1_advantage_scenarios:  # sequence[float]: seat-one advantage scenarios
  delta_equivalence:  # float|None: equivalence margin; null disables it
  candidate_cap:  # int|None: cap on frozen H2H candidates
  candidate_cap_policy:  # str: candidate-cap selection policy
  min_candidate_completion_rate:  # float: minimum attempted-game completion rate
  max_attempt_multiplier:  # float: cap on attempts relative to completed target
  total_game_cap:  # int|None: operational H2H total-game authorization cap
  allow_single_root:  # bool: permit labelled single-root H2H execution

hgb:
  max_depth:  # int: maximum tree depth
  n_estimators:  # int: boosting iterations
  heldout_folds:  # int: deterministic held-out strategy folds
  permutation_repeats:  # int: held-out permutation repeats per fold
  future_proposal_limit:  # int: candidates reserved for future simulation

orchestration:
  parallel_seeds:  # bool: run two root workflows concurrently

resources:
  scheduler_memory_budget_mb:  # int: worker-admission memory budget
  process_tree_warning_threshold_mb:  # int: cooperative process-tree RSS high water
  aggregate_memory_hard_limit_mb:  # int: explicit aggregate Job/cgroup hard limit
  minimum_system_available_memory_mb:  # int: host memory kept available before scheduling
  os_memory_limit_enabled:  # bool: establish an OS memory boundary
  os_memory_limit_required:  # bool: fail closed if the boundary is unavailable
  allow_unenforced_memory_fallback:  # bool: development-only fallback
  parent_process_memory_mb:  # int: parent-process scheduling estimate
  logical_cpu_budget:  # int: zero means detected logical CPUs
  native_threads_per_worker:  # int: native-library threads per worker
  max_in_flight_per_worker:  # int: bounded task-submission multiplier
  rss_sample_interval_seconds:  # float: cooperative RSS sampling interval
  estimated_worker_memory_mb: {}  # mapping[str, int]: per-stage worker estimates
  stage_batch_bytes: {}  # mapping[str, int]: per-stage streaming byte budgets

rng:
  scheme_version:  # int: deterministic RNG contract version
  bit_generator:  # str: NumPy bit-generator name

profile:
  purpose:  # smoke|integration|production
  reduced_resolution:  # bool: reduced-resolution evidence only
  production_eligible:  # bool: may support production claims
  release_eligible:  # bool: may pass the release eligibility gate

screening:
  resolution_delta:  # float: maximum full Wilson interval width
  interval_confidence:  # float: locked screening interval confidence
  practical_delta_by_k:  # mapping[int, float]|None: practical threshold by k
  delta_across_k:  # float|None: cross-k practical threshold
  bootstrap_replicates:  # int: screening bootstrap replicate count
  candidate_contribution_size:  # int: root/k TrueSkill contribution size
  controls:  # list[int]: required control strategy identifiers
  mandatory_diagnostics:  # list[int]: required diagnostic strategy identifiers
  max_shuffles_per_root_k:  # int|None: per-root/k workload cap
  projected_games_per_second:  # float|None: planning throughput estimate

batching:
  target_batches:  # int: deterministic shuffle batches per root/k
  min_shuffles_per_batch:  # int: minimum shuffles in each batch

robustness:
  report_pareto:  # bool: emit Pareto membership summary
  report_maximin:  # bool: emit maximin-leadership summary
  delta_seed_stability:  # float: practical two-root stability threshold
  joint_discrepancy_alpha:  # float: joint discrepancy reference upper-tail fraction
  matched_count_fractions:  # sequence[float]: matched-count stability fractions

artifact_contract:
  artifact_contract_version:  # int: authenticated artifact-contract version
  estimand_version:  # int: estimand definition version
  schema_version:  # int: derived artifact schema version
  baseline_version:  # int: chance-baseline definition version
  k_support_version:  # int: player-count support definition version
  weighting_version:  # int: cross-k weighting definition version
  conditioning_version:  # int: outcome-conditioning definition version
  multiplicity_version:  # int: multiplicity procedure version
  candidate_family_version:  # int: frozen candidate-family definition version

k_aggregation:
  method:  # str: equal-k or declared-mapping aggregation method
  k_weights:  # mapping[int, float]|None: declared cross-k weights
